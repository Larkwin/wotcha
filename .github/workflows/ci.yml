name: CI

# A family depends on main, and the repo is public. Every push and every pull
# request gets the same check the author would run locally -- and gets it
# somewhere that cannot be skipped in a hurry on a Saturday evening.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject, and the version actually developed
        # against. A passing suite on only one of them is a passing suite on
        # neither claim.
        python-version: ["3.12", "3.14"]

    env:
      # The suite is entirely moto-backed and `-m 'not integration'` deselects
      # anything that is not -- but a test that escaped either guard would
      # otherwise reach real AWS from CI. Deliberately invalid credentials
      # make that impossible rather than unlikely.
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SESSION_TOKEN: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
