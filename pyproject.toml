[project]
name = "wotcha"
version = "0.1.0"
description = "A household agent that decides dinner."
requires-python = ">=3.12"
dependencies = [
    "strands-agents",
    "strands-agents-tools",
    "bedrock-agentcore",
    "boto3",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "moto[dynamodb]", "ruff", "bedrock-agentcore-starter-toolkit==0.3.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wotcha"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts", "lambdas"]
testpaths = ["tests"]
markers = ["integration: hits real AWS; deselected by default"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
